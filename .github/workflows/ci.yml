name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate API contract types
        run: node ../../contracts/scripts/build-contracts.mjs

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-pub

      # Goldens use the bundled Be Vietnam Pro font, whose rasterization is
      # platform-dependent; they are generated and verified on the dev host.
      - name: Test (unit, widget, core)
        run: flutter test --no-pub test/unit test/widget test/core

  api:
    name: API unit + contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - name: Generate API contract types
        run: node ../../contracts/scripts/build-contracts.mjs

      - name: Check generated OpenAPI contract
        run: git -C ../.. diff --exit-code -- contracts/openapi/farmly-v1.yaml

      - name: Unit tests
        run: npm run test:unit

      - name: Contract tests
        run: npm run test:contract
